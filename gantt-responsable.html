<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gantt por Responsable · Bagó Ecuador 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:      #0a0b0f;
    --surface: #111318;
    --border:  #1a1d26;
    --text:    #e8eaf0;
    --muted:   #4a5068;
    --magenta: #e040fb;
    --cyan:    #26c6da;
    --yellow:  #ffa726;
    --red:     #ef5350;
    --green:   #66bb6a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    padding: 20px;
    min-height: 100vh;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 24px;
    overflow: hidden;
  }
  .card-header {
    display: flex; justify-content: space-between;
    align-items: flex-start; margin-bottom: 20px;
    flex-wrap: wrap; gap: 10px;
  }
  .card-label {
    font-size: 9px; font-weight: 500;
    letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 3px;
  }
  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 700; color: var(--text);
  }
  .legend {
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
  }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 10px; color: var(--muted);
  }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; }

  /* ── SCROLL WRAPPER ── */
  .gantt-scroll { overflow-x: auto; overflow-y: visible; }

  /* Columnas fijas */
  .COL_NAME  { width: 190px; min-width: 190px; flex-shrink: 0; }
  .COL_TIPO  { width: 28px;  min-width: 28px;  flex-shrink: 0; }
  /* Cada semana: 22px */
  .WEEK_W    { width: 22px; }
  .TOTAL_W   { /* 52 semanas × 22px = 1144px */ }

  /* ── HEADER ── */
  .gantt-head {
    display: flex;
    align-items: stretch;
    border-bottom: 2px solid var(--border);
    margin-bottom: 0;
    min-width: max-content;
  }
  .head-spacer {
    width: 218px; min-width: 218px; flex-shrink: 0;
  }
  .head-timeline {
    display: flex; flex-direction: column;
    flex: 1;
  }

  /* Fila de meses */
  .months-row {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .month-cell {
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text);
    background: rgba(224,64,251,0.06);
    border-right: 1px solid var(--border);
    padding: 5px 0;
  }
  .month-cell:last-child { border-right: none; }

  /* Fila de semanas */
  .weeks-row {
    display: flex;
  }
  .week-cell {
    width: 22px; min-width: 22px;
    display: flex; align-items: center; justify-content: center;
    font-size: 7px; color: var(--muted);
    border-right: 1px solid rgba(26,29,38,0.5);
    padding: 3px 0;
    font-weight: 500;
  }
  .week-cell:last-child { border-right: none; }
  .week-cell.today-week {
    color: var(--yellow);
    font-weight: 700;
    background: rgba(255,167,38,0.08);
  }

  /* ── RESPONSABLE BLOCK ── */
  .resp-block { min-width: max-content; }
  .resp-sep {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 0 6px 0;
    border-bottom: 1px solid var(--border);
    min-width: max-content;
  }
  .resp-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .resp-name {
    font-family: 'Syne', sans-serif;
    font-size: 12px; font-weight: 700; color: var(--text);
  }
  .resp-count { font-size: 10px; color: var(--muted); }

  /* ── PROJ ROW ── */
  .proj-row {
    display: flex; align-items: center;
    height: 30px;
    border-bottom: 1px solid rgba(26,29,38,0.4);
    min-width: max-content;
  }
  .proj-row:last-child { border-bottom: none; }

  .proj-name-col {
    width: 190px; min-width: 190px; flex-shrink: 0;
    font-size: 11px; color: var(--text);
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; padding-right: 8px;
  }
  .proj-tipo-col {
    width: 28px; min-width: 28px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .tipo-badge {
    display: inline-block; padding: 2px 4px;
    border-radius: 3px; font-size: 7px; font-weight: 700;
  }
  .tipo-e { background:rgba(224,64,251,0.15); color:var(--magenta); }
  .tipo-t { background:rgba(38,198,218,0.15);  color:var(--cyan); }
  .tipo-c { background:rgba(102,187,106,0.15); color:var(--green); }
  .tipo-i { background:rgba(255,167,38,0.15);  color:var(--yellow); }

  /* Timeline de la fila */
  .proj-timeline {
    position: relative;
    height: 100%;
    display: flex; align-items: center;
    /* width se setea inline = 52 × 22px */
  }

  /* Grid lines semanales */
  .week-grid {
    position: absolute; top: 0; bottom: 0;
    width: 1px; background: rgba(26,29,38,0.6);
    pointer-events: none;
  }
  .week-grid.month-start {
    background: rgba(255,255,255,0.08);
  }
  .week-grid.today-col {
    background: var(--yellow);
    opacity: 0.5; width: 22px;
    z-index: 1;
  }

  /* Barra */
  .gantt-bar {
    position: absolute; height: 16px; border-radius: 3px;
    display: flex; align-items: center; overflow: hidden;
    cursor: pointer; opacity: 0; z-index: 2;
    transition: opacity 0.4s ease, filter 0.15s ease;
  }
  .gantt-bar.show { opacity: 1; }
  .gantt-bar:hover { filter: brightness(1.25); }
  .bar-label {
    font-size: 8px; font-weight: 600;
    color: rgba(255,255,255,0.9);
    white-space: nowrap; padding: 0 4px;
    overflow: hidden; text-overflow: ellipsis;
  }

  /* Línea hoy */
  .today-line {
    position: absolute; top: -3px; bottom: -3px;
    width: 2px; background: var(--yellow);
    opacity: 0.8; z-index: 10; pointer-events: none;
    border-radius: 1px;
  }

  /* Footer */
  .footer {
    display: flex; justify-content: space-between;
    align-items: center; margin-top: 16px;
    padding-top: 14px; border-top: 1px solid var(--border);
    flex-wrap: wrap; gap: 8px;
  }
  .footer-brand { font-size: 10px; color: var(--muted); }
  .footer-brand span { color: var(--magenta); }
  .footer-date { font-size: 10px; color: var(--muted); }

  /* Loader */
  .loader-wrap {
    display: flex; align-items: center;
    justify-content: center; min-height: 180px;
  }
  .loader-ring {
    width: 30px; height: 30px;
    border: 3px solid var(--border);
    border-top-color: var(--magenta);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg { color: var(--red); font-size:12px; text-align:center; padding:20px; }

  /* Tooltip */
  .tooltip {
    position: fixed; background: #1a1d26;
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; pointer-events: none;
    z-index: 999; display: none; min-width: 200px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .tt-name {
    font-family: 'Syne', sans-serif;
    font-size: 12px; font-weight: 700;
    color: var(--text); margin-bottom: 8px; line-height: 1.3;
  }
  .tt-row { display:flex; justify-content:space-between; gap:16px; margin-bottom:3px; }
  .tt-row .lbl { color:var(--muted); font-size:10px; }
  .tt-row .val { color:var(--text); font-size:10px; font-weight:500; }
</style>
</head>
<body>

<div class="tooltip" id="tooltip">
  <div class="tt-name" id="tt-name"></div>
  <div class="tt-row"><span class="lbl">Inicio</span><span class="val" id="tt-start"></span></div>
  <div class="tt-row"><span class="lbl">Fin</span><span class="val" id="tt-end"></span></div>
  <div class="tt-row"><span class="lbl">Tipo</span><span class="val" id="tt-tipo"></span></div>
  <div class="tt-row"><span class="lbl">SPI</span><span class="val" id="tt-spi"></span></div>
</div>

<div class="card">
  <div class="card-header">
    <div>
      <div class="card-label">Gestión de Capacidad · Bagó Ecuador · 2026</div>
      <div class="card-title">Línea de Tiempo por Responsable</div>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--magenta)"></div>Estratégico</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--cyan)"></div>Táctico</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>Cambio</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--yellow)"></div>Iniciativa BRM</div>
      <div class="legend-item">
        <div style="width:2px;height:14px;background:var(--yellow);border-radius:1px"></div>Hoy
      </div>
    </div>
  </div>

  <div id="loader" class="loader-wrap"><div class="loader-ring"></div></div>

  <div id="ganttScroll" class="gantt-scroll" style="display:none">
    <div id="ganttHead" class="gantt-head"></div>
    <div id="ganttBody"></div>
  </div>

  <div class="footer">
    <div class="footer-brand">Portafolio Estratégico + Táctico · <span>Bagó Ecuador</span></div>
    <div class="footer-date" id="footerDate"></div>
  </div>
</div>

<script>
  const TOKEN   = 'ntn_h28436678537wLv37VyJFvRRrho77CWB0CCKSFw61lt8rL';
  const WORKER  = 'https://royal-limit-9465.pochoa.workers.dev/';
  const DB_ESTR = '24d0a97eed8d81e99427e311c9f026aa';
  const DB_TACT = '3210a97eed8d80628599c65e6b0b4ed1';

  const WEEK_W  = 22;   // px por semana
  const YEAR    = 2026;
  const MES_ES  = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const RESP_COLORS = ['#e040fb','#26c6da','#66bb6a','#ffa726','#7c4dff','#f06292','#80cbc4','#ffcc02'];

  // ── Generar semanas del año ──
  // Semana 1 = lunes de la primera semana ISO de 2026
  function getWeeks() {
    const weeks = [];
    // Primer lunes del año (ISO week 1 start)
    let d = new Date(YEAR, 0, 1);
    // Ajustar al lunes de esa semana
    const day = d.getDay(); // 0=dom,1=lun...
    const diff = (day === 0) ? 1 : (day === 1 ? 0 : 8 - day);
    d = new Date(YEAR, 0, 1 + (day === 1 ? 0 : (day === 0 ? 1 : 8 - day)));
    // Más simple: primer lunes >= 29 dic 2025
    d = new Date(2025, 11, 29); // 29 dic 2025 es lunes de semana 1 de 2026
    for (let w = 1; w <= 52; w++) {
      weeks.push({ num: w, start: new Date(d), month: d.getMonth() });
      d = new Date(d.getTime() + 7 * 24 * 3600 * 1000);
    }
    return weeks;
  }

  const WEEKS = getWeeks();
  const YEAR_START = WEEKS[0].start;
  const YEAR_END   = new Date(WEEKS[51].start.getTime() + 6 * 24 * 3600 * 1000); // fin dom semana 52
  const TOTAL_W_PX = WEEKS.length * WEEK_W;

  // Calcular semana (0-indexed) dado una fecha
  function dateToWeekIdx(date) {
    const ms = date - YEAR_START;
    if (ms < 0) return 0;
    const idx = Math.floor(ms / (7 * 24 * 3600 * 1000));
    return Math.min(idx, WEEKS.length - 1);
  }

  // Hoy
  const TODAY = new Date();
  const TODAY_WEEK = dateToWeekIdx(TODAY);

  async function api(url, payload={}) {
    const res = await fetch(WORKER, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({url, token:`Bearer ${TOKEN}`, payload})
    });
    return res.json();
  }

  function getTitle(prop) {
    if (!prop || prop.type!=='title') return 'Sin nombre';
    return prop.title?.[0]?.plain_text ?? 'Sin nombre';
  }
  function getSelect(prop) {
    if (!prop) return null;
    if (prop.type==='select') return prop.select?.name ?? null;
    return null;
  }
  function getDates(prop) {
    if (!prop || prop.type!=='date') return {start:null,end:null};
    return {
      start: prop.date?.start ? new Date(prop.date.start) : null,
      end:   prop.date?.end   ? new Date(prop.date.end)   : null
    };
  }
  function getNum(prop) {
    if (!prop) return null;
    if (prop.type==='number')  return prop.number ?? null;
    if (prop.type==='formula') return prop.formula?.number ?? null;
    if (prop.type==='rollup')  return prop.rollup?.number  ?? null;
    return null;
  }
  function fmtDate(d) {
    if (!d) return '—';
    return d.toLocaleDateString('es-EC',{day:'2-digit',month:'short',year:'numeric'});
  }

  async function loadDB(dbId, tipoBase) {
    const data  = await api(`https://api.notion.com/v1/databases/${dbId}/query`,{page_size:100});
    const pages = data.results || [];
    return pages.map(p => {
      const titleProp = p.properties['Nombre del proyecto']
        || p.properties['Name']
        || Object.values(p.properties).find(x=>x.type==='title');
      const dates = getDates(p.properties['Fechas']);
      const tipoNotion = getSelect(p.properties['Tipo']);
      const tipo = tipoBase === 'Estratégico'
        ? 'Estratégico'
        : (tipoNotion === 'Cambio' ? 'Cambio' : tipoNotion === 'Iniciativa BRM' ? 'Iniciativa BRM' : 'Táctico');
      return {
        name:        getTitle(titleProp),
        responsable: getSelect(p.properties['Responsable 1']) || 'Sin asignar',
        start:       dates.start,
        end:         dates.end,
        spi:         getNum(p.properties['SPI']),
        tipo
      };
    }).filter(p => p.start && p.end);
  }

  function buildHeader() {
    const head = document.getElementById('ganttHead');

    const spacer = document.createElement('div');
    spacer.className = 'head-spacer';
    head.appendChild(spacer);

    const tlHead = document.createElement('div');
    tlHead.className = 'head-timeline';

    // ── Fila meses ──
    const monthsRow = document.createElement('div');
    monthsRow.className = 'months-row';

    // Agrupar semanas por mes
    const monthGroups = {};
    WEEKS.forEach((w,i) => {
      const m = w.month;
      if (!monthGroups[m]) monthGroups[m] = [];
      monthGroups[m].push(i);
    });

    Object.entries(monthGroups).sort((a,b)=>+a[0]-+b[0]).forEach(([m, idxs]) => {
      const cell = document.createElement('div');
      cell.className = 'month-cell';
      cell.style.width  = (idxs.length * WEEK_W) + 'px';
      cell.style.minWidth = (idxs.length * WEEK_W) + 'px';
      cell.textContent = MES_ES[+m];
      monthsRow.appendChild(cell);
    });
    tlHead.appendChild(monthsRow);

    // ── Fila semanas ──
    const weeksRow = document.createElement('div');
    weeksRow.className = 'weeks-row';
    WEEKS.forEach((w,i) => {
      const cell = document.createElement('div');
      cell.className = 'week-cell' + (i === TODAY_WEEK ? ' today-week' : '');
      cell.textContent = w.num;
      weeksRow.appendChild(cell);
    });
    tlHead.appendChild(weeksRow);
    head.appendChild(tlHead);
  }

  function buildBody(projects) {
    const body = document.getElementById('ganttBody');

    const respMap = {};
    projects.forEach(p => {
      if (!respMap[p.responsable]) respMap[p.responsable] = [];
      respMap[p.responsable].push(p);
    });
    const respNames  = Object.keys(respMap).sort();
    const respColors = {};
    respNames.forEach((r,i) => respColors[r] = RESP_COLORS[i % RESP_COLORS.length]);

    respNames.forEach(resp => {
      const projs = respMap[resp];
      const color = respColors[resp];
      const block = document.createElement('div');
      block.className = 'resp-block';

      // Separador
      const sep = document.createElement('div');
      sep.className = 'resp-sep';
      sep.innerHTML = `
        <span class="resp-dot" style="background:${color}"></span>
        <span class="resp-name">${resp}</span>
        <span class="resp-count">${projs.length} proyecto${projs.length!==1?'s':''}</span>`;
      block.appendChild(sep);

      projs.forEach(p => {
        const row = document.createElement('div');
        row.className = 'proj-row';

        // Nombre
        const nc = document.createElement('div');
        nc.className = 'proj-name-col';
        nc.title = p.name; nc.textContent = p.name;

        // Tipo badge
        const tc = document.createElement('div');
        tc.className = 'proj-tipo-col';
        tc.innerHTML = p.tipo==='Estratégico'
          ? '<span class="tipo-badge tipo-e">E</span>'
          : p.tipo==='Cambio'
            ? '<span class="tipo-badge tipo-c">C</span>'
            : p.tipo==='Iniciativa BRM'
              ? '<span class="tipo-badge tipo-i">I</span>'
              : '<span class="tipo-badge tipo-t">T</span>';

        // Timeline
        const tl = document.createElement('div');
        tl.className = 'proj-timeline';
        tl.style.width  = TOTAL_W_PX + 'px';
        tl.style.minWidth = TOTAL_W_PX + 'px';

        // Grid lines semanales
        WEEKS.forEach((w,i) => {
          const gl = document.createElement('div');
          gl.className = 'week-grid' + (w.num === 1 || (i > 0 && WEEKS[i].month !== WEEKS[i-1].month) ? ' month-start' : '');
          gl.style.left = (i * WEEK_W) + 'px';
          tl.appendChild(gl);
        });

        // Highlight semana actual
        const todayHL = document.createElement('div');
        todayHL.className = 'week-grid today-col';
        todayHL.style.left = (TODAY_WEEK * WEEK_W) + 'px';
        tl.appendChild(todayHL);

        // Línea hoy (centro de la semana)
        const todayLine = document.createElement('div');
        todayLine.className = 'today-line';
        todayLine.style.left = (TODAY_WEEK * WEEK_W + WEEK_W / 2) + 'px';
        tl.appendChild(todayLine);

        // Calcular barra
        // Clamp fechas al rango del año
        const barStart = p.start < YEAR_START ? YEAR_START : p.start;
        const barEnd   = p.end   > YEAR_END   ? YEAR_END   : p.end;

        if (barEnd >= YEAR_START && barStart <= YEAR_END) {
          const startWk = dateToWeekIdx(barStart);
          const endWk   = Math.min(dateToWeekIdx(barEnd) + 1, WEEKS.length);
          const leftPx  = startWk * WEEK_W;
          const widthPx = Math.max((endWk - startWk) * WEEK_W, WEEK_W);

          const barColor = p.tipo==='Estratégico'
            ? 'linear-gradient(90deg,rgba(224,64,251,0.85),rgba(224,64,251,0.55))'
            : p.tipo==='Cambio'
              ? 'linear-gradient(90deg,rgba(102,187,106,0.85),rgba(102,187,106,0.55))'
              : p.tipo==='Iniciativa BRM'
                ? 'linear-gradient(90deg,rgba(255,167,38,0.85),rgba(255,167,38,0.55))'
                : 'linear-gradient(90deg,rgba(38,198,218,0.85),rgba(38,198,218,0.55))';

          const bar = document.createElement('div');
          bar.className = 'gantt-bar';
          bar.style.cssText = `left:${leftPx}px;width:${widthPx}px;background:${barColor}`;
          bar.innerHTML = `<span class="bar-label">${p.name}</span>`;
          bar.dataset.name  = p.name;
          bar.dataset.start = fmtDate(p.start);
          bar.dataset.end   = fmtDate(p.end);
          bar.dataset.tipo  = p.tipo;
          bar.dataset.spi   = p.spi!=null ? p.spi.toFixed(2) : '—';
          tl.appendChild(bar);
          setTimeout(() => bar.classList.add('show'), 250);
        }

        row.appendChild(nc);
        row.appendChild(tc);
        row.appendChild(tl);
        block.appendChild(row);
      });

      body.appendChild(block);
    });
  }

  // Tooltip
  const tooltip = document.getElementById('tooltip');
  document.addEventListener('mousemove', e => {
    const bar = e.target.closest('.gantt-bar');
    if (bar) {
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX+14)+'px';
      tooltip.style.top  = (e.clientY-10)+'px';
      document.getElementById('tt-name').textContent  = bar.dataset.name;
      document.getElementById('tt-start').textContent = bar.dataset.start;
      document.getElementById('tt-end').textContent   = bar.dataset.end;
      document.getElementById('tt-tipo').textContent  = bar.dataset.tipo;
      document.getElementById('tt-spi').textContent   = bar.dataset.spi;
    } else {
      tooltip.style.display = 'none';
    }
  });

  async function load() {
    try {
      const [estr, tact] = await Promise.all([
        loadDB(DB_ESTR,'Estratégico'),
        loadDB(DB_TACT,'Táctico')
      ]);
      const all = [...estr,...tact];
      if (!all.length) throw new Error('Sin proyectos');

      buildHeader();
      buildBody(all);

      const now = new Date();
      document.getElementById('footerDate').textContent =
        'Actualizado: ' + now.toLocaleDateString('es-EC',{day:'2-digit',month:'short',year:'numeric'}) +
        ' · ' + now.toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'});

      document.getElementById('loader').style.display     = 'none';
      document.getElementById('ganttScroll').style.display = 'block';

    } catch(e) {
      console.error(e);
      document.getElementById('loader').innerHTML =
        '<div class="error-msg">No se pudo cargar el Gantt.</div>';
    }
  }

  load();
</script>
</body>
</html>
